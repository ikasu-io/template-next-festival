# A short description of every photo in content/images/, for people who
# cannot see it. The key is the file name without its extension.
hero-dyke: The main stage on the grassy dyke at blue hour, coral lights over a crowd seen from far behind, the sea and a lighthouse in the distance
greenhouse-tent: Dancers as blurred silhouettes inside an old glass greenhouse filled with haze and coloured light
beach-stage: A small wooden stage on the beach in the afternoon, people sitting on the sand in front of it
campsite: Colourful tents among the dunes at sunrise, bikes lying in the grass
food-trucks: Food stalls under string lights in the evening, people queuing seen from behind
shuttle-bikes: A long row of parked bicycles along a dyke road at sunset
crowd-hands: Hands raised in the air against coral stage light and falling confetti
brass-band: Brass instruments glinting in stage light
rain-ponchos: Festival-goers in coloured rain ponchos in light rain, a stage glowing in the distance
dawn-sea: The beach at dawn after the festival, footprints in the sand, a few people walking towards the sea
