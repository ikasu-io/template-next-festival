# Weekly dependency updates, minor and patch versions grouped into one pull
# request. Major versions (Next.js 17, React 20) come as separate pull
# requests and are handled with Ikasu.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
